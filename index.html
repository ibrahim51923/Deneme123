<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Baloncuk Patlatma</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="game">
      <header class="hud">
        <h1>Baloncuk Patlatma</h1>
        <div class="scoreboard">
          <span>Skor: <strong id="score">0</strong></span>
          <span>Süre: <strong id="time">30</strong>s</span>
        </div>
      </header>

      <section id="playground" aria-label="Oyun Alanı"></section>

      <footer class="controls">
        <button id="startBtn">Oyunu Başlat</button>
      </footer>
    </main>

    <script src="script.js"></script>
  </body>
</html>
